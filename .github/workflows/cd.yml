name: CD

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  jira-guard:
    name: Jira Guard
    permissions:
      pull-requests: read
      contents: read
    uses: byteit-ai/.github/.github/workflows/jira-guard.yml@main
    secrets: inherit

  validate-release:
    if: github.event_name == 'push'
    name: Validate release metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect release commit
        id: release_meta
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -Eq '^chore\(release\): [0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(echo "$COMMIT_MSG" | sed -E 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+)$/\1/')
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "Release commit detected: v$VERSION"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Not a release commit. Workflow will exit without publishing."
          fi

      - name: Ensure merge commit is on main
        if: steps.release_meta.outputs.should_publish == 'true'
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Merge commit is not on main"
            exit 1
          }

      - name: Install dependencies
        if: steps.release_meta.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine ruff

      - name: Run release validation
        if: steps.release_meta.outputs.should_publish == 'true'
        run: python scripts/release_preflight.py --ci

      - name: Create or validate release tag
        if: steps.release_meta.outputs.should_publish == 'true'
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"

          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            HEAD_SHA=$(git rev-parse HEAD)

            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "Tag $TAG exists but points to $TAG_SHA instead of HEAD $HEAD_SHA"
              exit 1
            fi

            echo "Tag $TAG already exists and points to current commit."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: validate-release
    if: needs.validate-release.outputs.should_publish == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Summary
        run: |
          {
            echo "## PyPI — Published"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ needs.validate-release.outputs.version }}\` |"
            echo "| Tag | \`${{ needs.validate-release.outputs.tag }}\` |"
            echo "| Status | Published to PyPI |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: AdolfoBOT — Notify Failure
    needs: [validate, publish]
    if: failure()
    uses: byteit-ai/.github/.github/workflows/adolfobot.yml@main
    with:
      workflow_name: "Publish to PyPI (release tags)"
      extra_context: |
        Release tag validation or PyPI publication failed. Inspect the tag, version files, and package build logs.
    secrets: inherit
